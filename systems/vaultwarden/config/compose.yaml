name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    environment:
      # Canonical external URL. Required for passkeys/WebAuthn, attachment links,
      # and any email links to resolve correctly. Reachable on-LAN and over
      # Tailscale only — there is no public DNS record or public ingress.
      - DOMAIN=https://vault.lab.yourdomain.com
      # Single-user homelab vault: no organization invitations, no password hints.
      # Open registration is governed by SIGNUPS_ALLOWED, which lives in .env so it
      # can be flipped for the one-time bootstrap without editing tracked config.
      # See runbook.md "First-run bootstrap".
      - INVITATIONS_ALLOWED=false
      - SHOW_PASSWORD_HINT=false
      - TZ=America/New_York
    volumes:
      - vaultwarden-data:/data
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.lab.yourdomain.com`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=cloudflare"
      # Modern Vaultwarden serves the notifications websocket over the main HTTP
      # port; the legacy 3012 listener is no longer needed.
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      # SQLite is only crash-consistent when quiesced — stop the container while the
      # weekly offen/docker-volume-backup job tars /data so the DB snapshot is clean.
      - "docker-volume-backup.stop-during-backup=true"

volumes:
  vaultwarden-data:

networks:
  traefik-proxy:
    external: true
