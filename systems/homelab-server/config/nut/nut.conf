# /etc/nut/nut.conf — NUT operating mode on the Proxmox host (homelab-server).
#
# netserver: run the driver + upsd + upsmon locally AND expose upsd on the LAN
# so the nut-exporter container on docker-host can scrape it for Grafana.
# Use "standalone" instead if you only want localhost visibility (no exporter).
#
# Why this runs on bare metal and not in an LXC/Docker/VM: the UPS is cabled by
# USB to this host, and this host must be able to halt everything above it on
# LOWBATT. See ../../decisions.md "UPS/NUT runs on the Proxmox host, not a container".

MODE=netserver
