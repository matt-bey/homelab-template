# /etc/nut/upsd.conf — upsd network listener.
#
# Listen on localhost for the local upsmon, and on the host's LAN address so the
# nut-exporter container (docker-host) can scrape battery/load/runtime for Grafana.
#
LISTEN 127.0.0.1 3493
LISTEN <homelab-server-ip> 3493

# Drop readings considered stale after this many seconds (matches a slow poll).
MAXAGE 15
