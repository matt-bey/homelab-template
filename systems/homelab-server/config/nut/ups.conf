# /etc/nut/ups.conf — UPS device definitions for homelab-server.
#
# The CP1500 is cabled by USB directly to this Proxmox host, which is why the
# driver runs here (bare metal owns the USB). usbhid-ups auto-selects its
# CyberPower subdriver from the device ID (vendor 0764).

maxretry = 3

[cp1500]
    driver = usbhid-ups
    port = auto
    desc = "CyberPower CP1500PFCRM2U (rack U11-12)"

    # CyberPower USB can be chatty. If `upsc cp1500@localhost` intermittently
    # reports "Data stale", uncomment a slower poll before reaching for the
    # PowerPanel fallback (see README.md "If usbhid-ups misbehaves").
    # pollinterval = 15
