# /etc/nut/upssched.conf — staged load-shedding timers.
#
# upsmon hands events here via NOTIFYCMD. Timers fire CMDSCRIPT with a label.
# Strategy (see ../../../network/plan.md "UPS power management"):
#   T+5m   -> stage1: disable PoE on basement + SE-office AP ports via UniFi API
#   T+10m  -> stage2: stop non-essential Docker containers on docker-host
#   LOWBATT -> upsmon's SHUTDOWNCMD halts this host (handled in upsmon.conf,
#              not here — it's a battery STATE, not a wall-clock timer)
#
# Timers self-adjust: the final halt is bound to the UPS's real LOWBATT, and any
# pending stage is cancelled the moment power returns (AT ONLINE ... CANCEL-TIMER).

CMDSCRIPT /etc/nut/handlers/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Immediate ntfy notifications — fire the instant the event happens, independent
# of the staged-shutdown timers below. EXECUTE runs CMDSCRIPT right away.
AT ONBATT  * EXECUTE onbatt
AT ONLINE  * EXECUTE online
AT LOWBATT * EXECUTE lowbatt

# On battery: arm the two staged timers (seconds).
AT ONBATT * START-TIMER stage1 300
AT ONBATT * START-TIMER stage2 600

# Power restored before a stage fires: cancel everything pending.
AT ONLINE * CANCEL-TIMER stage1
AT ONLINE * CANCEL-TIMER stage2
