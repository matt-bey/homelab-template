# Envoy Gateway Helm values REQUIRED by Envoy AI Gateway v0.6.0.
# Vendored verbatim from envoyproxy/ai-gateway@v0.6.0 manifests/envoy-gateway-values.yaml
# (Apache-2.0). Without these, Envoy Gateway never registers the AI Gateway extension
# hook, so Backend / MCPRoute / credential injection are invisible to it — the cause of
# "JWT: backend aigw/entra-jwks not found" when EG was first installed with stock values.
#
# Install/upgrade Envoy Gateway with this file:
#   helm upgrade -i eg oci://docker.io/envoyproxy/gateway-helm --version v1.8.0 \
#     -n envoy-gateway-system --create-namespace \
#     -f systems/envoy-ai-gateway/config/helm/envoy-gateway-values.yaml
#   kubectl rollout restart -n envoy-gateway-system deployment/envoy-gateway

config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      type: Kubernetes
    extensionApis:
      # Not strictly required, but recommended for backward/future compatibility.
      enableEnvoyPatchPolicy: true
      # Required: Enable Backend API for AI service backends.
      enableBackend: true
    # Required: AI Gateway needs to fine-tune xDS resources generated by Envoy Gateway.
    extensionManager:
      hooks:
        xdsTranslator:
          translation:
            listener:
              includeAll: true
            route:
              includeAll: true
            cluster:
              includeAll: true
            secret:
              includeAll: true
          post:
            - Translation
            - Cluster
            - Route
      service:
        fqdn:
          # Matches our install: release `aieg` in namespace envoy-ai-gateway-system.
          hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
          port: 1063
