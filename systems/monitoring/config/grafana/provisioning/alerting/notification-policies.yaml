# Grafana notification policies.
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Root policy: every alert routes to the n8n webhook. No child policies — we delegate
# all routing decisions to n8n itself (which inspects the `severity` label on the
# alert and maps to an ntfy Priority header).

apiVersion: 1

policies:
  - orgId: 1
    receiver: n8n-relay
    group_by: ["grafana_folder", "alertname"]
    # Wait this long after a group's first alert before sending, in case more arrive.
    group_wait: 30s
    # If the group still has firing alerts, send updates this often.
    group_interval: 5m
    # If the same alert is still firing, resend every 4h to avoid silent persistence.
    repeat_interval: 4h
