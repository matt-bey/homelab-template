# Grafana datasource provisioning.
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

apiVersion: 1

datasources:
  - name: Prometheus
    # Stable UID so dashboard imports resolve cleanly without manual remapping.
    uid: prometheus
    type: prometheus
    access: proxy
    # Reached over the traefik-proxy network by container DNS.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Match the scrape_interval in prometheus.yml so range queries align.
      timeInterval: "15s"
      httpMethod: POST
