name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    env_file: .env
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Route models through LiteLLM — not directly to Ollama
      - ENABLE_OLLAMA_API=False
      # Reaches litellm by container name on the shared traefik-proxy network
      - OPENAI_API_BASE_URL=http://litellm:4000
      # Web search via self-hosted SearXNG on the shared traefik-proxy network
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=5
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.open-webui.rule=Host(`open-webui.lab.yourdomain.com`)"
      - "traefik.http.routers.open-webui.entrypoints=websecure"
      - "traefik.http.routers.open-webui.tls.certresolver=cloudflare"
      - "traefik.http.services.open-webui.loadbalancer.server.port=8080"

volumes:
  open-webui-data:

networks:
  traefik-proxy:
    external: true
